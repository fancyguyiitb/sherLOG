id: F-03
name: db_pool_exhaustion
class: resource
severity: high
breaches_slo: availability

# Pair 2, first half. Same surface symptom as F-04 (gateway 504s, elevated pool waiters),
# but here the pool really is the cause rather than a casualty.
inject:
  mode: config_patch
  target: orders-svc
  change:
    DB_POOL_MAX: 3                # from 20
  revert:
    DB_POOL_MAX: 20

ground_truth:
  root_cause: >-
    The orders-svc Postgres connection pool was reduced to three connections by a
    configuration change, so concurrent checkout requests queue on pool acquisition until
    they time out and return 500s to the gateway.
  proximate_service: orders-svc
  originating_component: orders-svc
  causal_chain:
    - "orders-svc DB_POOL_MAX changed from 20 to 3; config hash changes"
    - "concurrent checkouts exceed available connections"
    - "db_pool_waiters grows past 10; acquisition waits approach the 3s timeout"
    - "orders-svc returns 500 on acquisition timeout"
    - "gateway returns 504 on /checkout; availability SLO burns fast"
  correct_fix_class: "restore DB_POOL_MAX; alert on pool waiters and acquisition p99"
  known_misdiagnosis: psp_latency_injection

expected_signals:
  metrics:
    - 'db_pool_waiters{service="orders-svc"} > 10'
    - "db_pool_size == 3 while db_pool_in_use == 3"
    - 'db_pool_acquire_seconds p99 approaching 3s'
    - 'upstream_duration_seconds{upstream="psp"} NORMAL'   # discriminator against F-04
  logs:
    - db.acquire.timeout
    - checkout.failed
  traces:
    - "span db.acquire dominates request duration"

decoys: [D-1]
expected_outcome: CONFIRMED
notes: >-
  The clean separation from F-04 is that here the psp upstream is healthy and the pool
  config moved; in F-04 the psp upstream is slow and the pool config did not move.
