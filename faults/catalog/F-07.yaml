id: F-07
name: observability_blind_spot
class: observability
severity: medium
breaches_slo: latency

# The abstention case. This is a SUCCESS STATE and it must be in the demo. It is the only
# fault where a confident, well-argued answer is scored as a failure.
# A telemetry blackout on payments-svc — no logs, no traces, no /metrics — plus a latency
# toxic on its provider link. The ONLY remaining view of payments-svc is from the outside:
# orders-svc's upstream timing shows payments-svc got slow. Nothing inside it is visible,
# so nothing can establish why. (Stopping only log shipping would not do: payments-svc's
# own psp-upstream histogram and its traces would still name the cause, and abstaining
# would then be the wrong answer.)
inject:
  mode: config_patch
  target: payments-svc
  change:
    TELEMETRY: "off"
  revert:
    TELEMETRY: "on"
  also:
    - mode: chaos
      target: toxiproxy/payments_to_psp
      change: {toxic: latency, latency_ms: 1000, jitter_ms: 100}

ground_truth:
  root_cause: >-
    payments-svc stopped emitting all telemetry and its payment-provider link was slowed,
    so orders-svc sees payments-svc calls degrade while no logs, traces or metrics from
    payments-svc exist for the window to establish why.
  proximate_service: payments-svc
  originating_component: unknown
  causal_chain:
    - "payments-svc telemetry export is switched off: no logs, traces or metrics"
    - "a 1000ms latency toxic is applied to the payments-to-psp link"
    - "orders-svc upstream timing shows payments-svc calls slowing"
    - "no logs, traces or metrics from payments-svc exist to explain the rise"
  correct_fix_class: "restore log shipping, then re-investigate; alert on log ingestion rate per service"
  known_misdiagnosis: psp_latency_injection

expected_signals:
  metrics:
    - 'upstream_duration_seconds{service="orders-svc",upstream="payments-svc"} elevated'
    - 'up{instance="payments-svc"} == 0; no payments-svc log lines in the window'
  logs: []
  traces: []

decoys: []
expected_outcome: INSUFFICIENT_EVIDENCE
notes: >-
  The correct output is INSUFFICIENT_EVIDENCE carrying a stated partial finding —
  "payments-svc is the proximate service; log evidence is unavailable for this window" —
  rather than a guess. A system that never says "I don't know" is a system that
  hallucinates, and any competent reviewer knows it. Scored as: abstained AND named the
  proximate service AND named the evidence gap.
