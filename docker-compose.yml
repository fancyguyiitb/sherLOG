# The whole stack: target system, observability, chaos, load. One Docker Compose file on
# one free-tier ARM box (Oracle Cloud Always Free, 4 OCPU / 24 GB; Hetzner CX22 at ~EUR4/mo
# is the fallback if free-tier ARM capacity is unavailable in the region).
#
# Rough memory budget: Loki 1.0G, Prometheus 1.5G, Tempo 1.0G, Postgres 1.0G, Redis 0.3G,
# five app services 1.5G, exporters + cAdvisor + Alloy 0.6G, k6 0.3G, sherLOG engine 1.5G
# ~= 9 GB, leaving generous headroom.
#
# Cost: $0.

name: nimbus

x-service-defaults: &service-defaults
  restart: unless-stopped
  # Code comes from the deploy repo, not the image: a deploy is a real commit there plus a
  # container recreate. `python -m faults.injector.cli reset` (re)builds that repo.
  volumes:
    - ./runtime/deploy-repo/nimbus:/app/nimbus:ro
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "3"}

x-common-env: &common-env
  COMMIT_SHA: ${COMMIT_SHA:-dev}
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317

services:
  # ---------------------------------------------------------------- Plane 1: target system
  #
  # Each service also reads runtime/env/<service>.env. That file is the config_patch (M1)
  # injection surface: the injector rewrites it and force-recreates the container — a real
  # restart with a real config-hash change, visible in runtime_state().

  gateway:
    <<: *service-defaults
    build: {context: ., dockerfile: nimbus/Dockerfile, args: {SERVICE: gateway}}
    ports: ["8000:8000"]
    env_file: [{path: ./runtime/env/gateway.env, required: false}]
    environment:
      <<: *common-env
      PORT: "8000"
      UPSTREAM_TIMEOUT_S: "5.0"
      UPSTREAM_RETRIES: "1"
    depends_on: [orders-svc]

  orders-svc:
    <<: *service-defaults
    build: {context: ., dockerfile: nimbus/Dockerfile, args: {SERVICE: orders_svc}}
    # CATALOG_CACHE_TTL_S (F-01) and DB_POOL_MAX (F-03) are overridden via the env file.
    env_file: [{path: ./runtime/env/orders-svc.env, required: false}]
    environment:
      <<: *common-env
      PORT: "8001"
      DATABASE_URL: postgresql://nimbus:nimbus@postgres:5432/nimbus
      # Through toxiproxy so D-1 (mild Redis latency decoy) is a real network toxic.
      REDIS_URL: redis://toxiproxy:8667/0
      UPSTREAM_RETRIES: "0"
    depends_on: [postgres, redis, payments-svc]

  payments-svc:
    <<: *service-defaults
    build: {context: ., dockerfile: nimbus/Dockerfile, args: {SERVICE: payments_svc}}
    env_file: [{path: ./runtime/env/payments-svc.env, required: false}]
    environment:
      <<: *common-env
      PORT: "8002"
      UPSTREAM_RETRIES: "0"
      # Through the chaos proxy, never straight at psp-stub. This indirection is what makes
      # F-04 a real network fault rather than a sleep in our own code.
      PSP_BASE_URL: http://toxiproxy:8666
      # The canary secret (sherlog.redaction.CANARY_SECRET). It surfaces in a startup log
      # line; it must never reach a model payload.
      PSP_API_KEY: AKIACANARYDONOTLEAK7
    depends_on: [toxiproxy]

  psp-stub:
    <<: *service-defaults
    build: {context: ., dockerfile: nimbus/Dockerfile, args: {SERVICE: psp_stub}}
    environment:
      <<: *common-env
      PORT: "8003"

  worker:
    <<: *service-defaults
    build: {context: ., dockerfile: nimbus/Dockerfile, args: {SERVICE: worker}}
    command: ["python", "-m", "nimbus.worker.main"]
    env_file: [{path: ./runtime/env/worker.env, required: false}]
    environment:
      <<: *common-env
      PORT: "8004"     # /metrics only
      DATABASE_URL: postgresql://nimbus:nimbus@postgres:5432/nimbus
      JOB_MAX_ATTEMPTS: "5"
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the nimbus database, the separate sherlog_truth database, and the two roles
      # whose separation the ground-truth isolation test asserts.
      - ./nimbus/db:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # F-02 sets REDIS_MAXMEMORY=8mb in runtime/env/redis.env and recreates this container.
    env_file: [{path: ./runtime/env/redis.env, required: false}]
    command: ["sh", "-c", "exec redis-server --maxmemory $${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save \"\""]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    ports: ["8474:8474"]   # control API — the F-04 and D-1 injection surface
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    volumes: [./ops/toxiproxy:/config:ro]

  # ---------------------------------------------------------------- Plane 2: observability

  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./ops/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    ports: ["3100:3100"]

  alloy:
    image: grafana/alloy:v1.3.0
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=48h
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./ops/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    ports: ["3200:3200", "4317:4317"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment: {REDIS_ADDR: "redis://redis:6379"}
    depends_on: [redis]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://nimbus:nimbus@postgres:5432/nimbus?sslmode=disable"
    depends_on: [postgres]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    # For US, not part of the product. sherLOG must never query Grafana — it reads Loki,
    # Prometheus and Tempo directly, which is what keeps the seven-tool contract honest.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes: [./ops/grafana:/etc/grafana/provisioning:ro]
    ports: ["3000:3000"]

  # ---------------------------------------------------------------- load

  k6:
    image: grafana/k6:0.53.0
    restart: unless-stopped
    command: ["run", "/scripts/checkout.js"]
    volumes: [./load:/scripts:ro]
    environment:
      K6_TARGET: http://gateway:8000
    depends_on: [gateway]

volumes:
  pgdata:
  promdata:
  lokidata:
  tempodata:
