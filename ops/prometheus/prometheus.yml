# 10s scrape, 48h retention. Short retention is deliberate: the free-tier box has 24GB and
# the observability stack has to leave room for the engine.

global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: nimbus-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nimbus-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8000
          - orders-svc:8001
          - payments-svc:8002
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance
        replacement: '$1'

  # Supplies the F-01 vs F-02 discriminator: evicted keys and memory headroom.
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  # Restart counts, OOM kills, per-container CPU/memory. Backs runtime_state().
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
