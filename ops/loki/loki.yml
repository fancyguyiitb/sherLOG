# Single-binary Loki on the filesystem. 24h retention — long enough to compare an incident
# window against the same window 24h prior, which every log_stats() call needs, and short
# enough to fit the free-tier disk alongside Prometheus and Tempo.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  # ~78 lines/s steady state; the headroom absorbs a fault that makes a service chatty.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  # log_stats() aggregates over the window rather than fetching lines, so query concurrency
  # matters more than raw line throughput.
  max_entries_limit_per_query: 5000
  allow_structured_metadata: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
