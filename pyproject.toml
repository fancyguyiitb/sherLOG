[project]
name = "sherlog"
version = "0.1.0"
description = "A verifiable AI SRE — autonomous root-cause analysis measured against injected ground truth"
requires-python = ">=3.12"

dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "tenacity>=9.0",        # retry ladder inside LLMClient
  "drain3>=0.9",          # log templating
  "httpx>=0.27",
  "openai>=1.50",         # the ONLY module that may import this is sherlog/llm/client.py
  "psycopg[binary]>=3.2",
  "langsmith>=0.1",       # agent tracing: one run per stage, tool call and model call
  "python-dotenv>=1.0",
  "fastapi>=0.115",       # the glass-box UI (ui/server.py)
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# The target system. Separate because sherLOG must never import from nimbus_common —
# keeping the dependency sets disjoint is what stops that boundary eroding by accident.
nimbus = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-psycopg>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "redis>=5.1",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sherlog", "faults", "nimbus", "eval", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# The seam that matters most: nothing outside sherlog/llm may import openai, and nothing in
# sherlog may import nimbus_common. Both are asserted in tests/test_boundaries.py rather
# than left to mypy, because they are architectural rules rather than type errors.
